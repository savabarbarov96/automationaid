name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Deploy to Server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          if [ -z "$SERVER_IP" ] || [ -z "$SERVER_USER" ]; then
            echo "Error: SERVER_IP or SERVER_USER is not defined in secrets."
            exit 1
          fi
          # Force pseudo-terminal allocation with -tt to help with connection issues
          ssh -tt -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP << 'EOF'
          cd /var/www/automationaid
          git pull origin main
          npm install
          npm run build
          sudo systemctl reload nginx
          EOF

      - name: Notify Discord on Success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{"content": "✅ Deployment succeeded for automationaid!"}' \
               "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Notify Discord on Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{"content": "🚨 Deployment failed for automationaid. Check GitHub Actions logs for details."}' \
               "${{ secrets.DISCORD_WEBHOOK_URL }}"
